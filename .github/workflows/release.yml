name: Release

# Builds and publishes one binary per platform, on a version tag only.
#
# Two rules from the wider convention this repository follows:
#
#   Nothing publishes on a branch push. A release starts from a tag vX.Y.Z, or from
#   a deliberate manual run. Checks stay on push; publishing does not.
#
#   The version lives in the git tags, never in a committed file. It is resolved
#   here with git describe and injected at link time. That is why the checkout below
#   uses fetch-depth: 0 — without the full history no tag is visible and every
#   binary would proudly report itself as "dev".

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Serialises runs of this workflow instead of letting them overlap.
#
# PREVENTIVE here, and worth saying plainly: today each run publishes to the tag of ITS OWN
# version, so an older one finishing last overwrites nothing. The guard is in place before the
# thing it protects, namely the ongoing alignment that will add a manifest and a
# generic-name file shared across versions.
#
# That is when the defect becomes real, and it has already happened elsewhere: on a sibling
# project an older build started 34 minutes earlier, finished 14 minutes later, and
# republished the previous version over the new one. A read-modify-write with no guard lets
# the last writer win regardless of version.
#
# `cancel-in-progress: false` is the part that matters: cancelling would abort a release
# mid-publication. Queueing preserves tag order.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Resolve the version from the tag
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then
              echo "::error::No version tag found. Tag a release before running this manually."
              exit 1
            fi
            VERSION="${TAG#v}"
            echo "Manual run: building the latest tag ($TAG)."
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          NAME="noisecrypt-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          mkdir -p dist
          # -trimpath keeps absolute build paths out of the binary, which is both a
          # reproducibility property and a small privacy one.
          go build -trimpath \
            -ldflags "-s -w -X github.com/bzhzion/noisecrypt/internal/cli.Version=${{ steps.version.outputs.version }}" \
            -o "dist/$NAME" ./cmd/noisecrypt
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - name: Verify the version was injected
        # Only for the host platform: the others cannot run here. Without this, a
        # broken ldflags path ships six binaries that all report "dev", and nobody
        # notices until someone files a bug against the wrong version.
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          GOT=$(./dist/$NAME version)
          if [ "$GOT" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::binary reports version '$GOT', expected '${{ steps.version.outputs.version }}'"
            exit 1
          fi

      - name: Checksum
        run: cd dist && sha256sum "$NAME" > "$NAME.sha256"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: noisecrypt-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  installer:
    name: Windows installer
    needs: build
    # Never a self-hosted runner: this repository is public, and a fork's pull request
    # would otherwise run on our own machines.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the version from the tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then
              echo "::error::No version tag found. Tag a release before running this manually."
              exit 1
            fi
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Collect the Windows binaries built above
        uses: actions/download-artifact@v4
        with:
          pattern: noisecrypt-windows-*
          path: incoming
          merge-multiple: true

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            # The hosted image normally ships it. Installing when it is missing rather
            # than assuming, so the job does not start failing the day the image changes.
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup is still not present" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Lay the binaries out the way the installer expects
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          # Forward slashes throughout. PowerShell, Inno Setup and Go all accept them on
          # Windows, and it keeps this file free of backslash sequences that look like
          # escapes to anything reading the YAML as text.
          New-Item -ItemType Directory -Force staging/amd64, staging/arm64 | Out-Null
          foreach ($arch in @("amd64", "arm64")) {
            Copy-Item "incoming/noisecrypt-$v-windows-$arch.exe" "staging/$arch/noisecrypt.exe"
          }

      # Whether we can sign at all. Checked once and reported, rather than each signing
      # step failing on its own or, worse, being skipped quietly: an unsigned installer
      # looks exactly like a signed one until a user's machine refuses it, so the one
      # thing this must not do is stay silent about it.
      - name: Can we sign?
        id: signing
        shell: bash
        env:
          HAVE: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
        run: |
          echo "enabled=$HAVE" >> "$GITHUB_OUTPUT"
          if [ "$HAVE" = "true" ]; then
            echo "Signing with Azure Trusted Signing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Unsigned release::AZURE_CLIENT_SECRET is not set on this repository, so the binaries and the installer are NOT signed. Windows SmartScreen will warn on download."
            echo "**Unsigned release.** No Azure Trusted Signing credentials are configured, so Windows will warn users on download." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The executables first, then the installers built around them. Signing only the
      # installer leaves the program it drops on disk unsigned, which is the file that
      # actually runs.
      - name: Sign the executables
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://weu.codesigning.azure.net/
          trusted-signing-account-name: breizhzion-signing
          certificate-profile-name: breizhzion-public
          files-folder: staging
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build one installer per architecture
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          foreach ($arch in @("amd64", "arm64")) {
            & $env:ISCC /Q "/DAppVersion=$v" "/DArch=$arch" `
              "/DBinary=../staging/$arch/noisecrypt.exe" installer/noisecrypt.iss
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed for $arch" }
          }
          Get-ChildItem installer/dist

      - name: Sign the installers
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://weu.codesigning.azure.net/
          trusted-signing-account-name: breizhzion-signing
          certificate-profile-name: breizhzion-public
          files-folder: installer/dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # A signature that did not attach is invisible: the file still exists, still runs,
      # and only a user's machine ever notices. Verified here while it can still fail the
      # build.
      - name: Verify the signatures attached
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem installer/dist/*.exe, staging/*/noisecrypt.exe) {
            $s = Get-AuthenticodeSignature $f.FullName
            "$($f.Name): $($s.Status)"
            if ($s.Status -ne "Valid") { $bad++ }
          }
          if ($bad -gt 0) { throw "$bad file(s) are not validly signed" }

      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          cd installer/dist
          for f in *.exe; do sha256sum "$f" > "$f.sha256"; done

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: noisecrypt-windows-installer
          path: installer/dist/*
          retention-days: 7

  publish:
    name: Publish the release
    needs: [build, installer]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - name: Download every artefact
        uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true

      - name: Resolve the version from the tag
        id: version
        run: |
          set -euo pipefail
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # A Debian package per architecture, built from the binaries produced above rather
      # than by a second compilation. Transcribed from the sibling project hublot, which
      # is the closest case: no framework, one static executable and nothing else.
      #
      # Versioning for the .deb is delegated to the apt repository and NOT duplicated on
      # R2: a reprepro pool keeps every version under its own filename and its `Packages`
      # index already pins the SHA256 of each one. Publishing a versioned copy elsewhere
      # would be a second source of truth for the same thing.
      - name: Build the Debian packages
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          for ARCH in amd64 arm64; do
            RACINE="pkgroot-$ARCH"
            rm -rf "$RACINE"
            mkdir -p "$RACINE/DEBIAN" "$RACINE/usr/bin"
            cp "artefacts/noisecrypt-$V-linux-$ARCH" "$RACINE/usr/bin/noisecrypt"
            chmod 755 "$RACINE/usr/bin/noisecrypt"
            cat > "$RACINE/DEBIAN/control" <<EOF
          Package: noisecrypt
          Version: $V
          Section: utils
          Priority: optional
          Architecture: $ARCH
          Maintainer: BREIZHZION <contact@breizhzion.com>
          Description: Encrypts any file into a container that can be carried as video
           NoiseCrypt seals a file into a .ncry container with hybrid post-quantum
           cryptography, and can turn that container into an ordinary video file so it
           survives a platform that re-encodes everything it is given.
          EOF
            dpkg-deb --build --root-owner-group "$RACINE" "artefacts/noisecrypt_${V}_${ARCH}.deb"
          done
          ls -la artefacts/*.deb

      - name: Collect the checksums into one file
        run: |
          set -euo pipefail
          cd artefacts
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -la

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artefacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      # ── Publie sur dl.breizhzion.com (bucket R2 partage breizhzion-releases) ────
      # Shared download domain for every product in this estate except justmakeq, which
      # keeps its own. Three URL shapes that do different jobs:
      #   - the FIXED name, overwritten each release: website buttons and curl one-liners;
      #   - the VERSIONED immutable copy: package managers, which pin a SHA256 per version.
      #     An overwritten fixed name invalidates the hash of an already-accepted winget
      #     manifest, which has happened for real (microsoft/winget-pkgs#399072);
      #   - LATEST.JSON: what a site reads to show the current version without a redeploy.
      #
      # Through the S3 API rather than `wrangler r2 object`, and not out of preference:
      # per-bucket R2 permissions only work over the S3 API, the Cloudflare API requiring
      # an account-wide one. This repository is PUBLIC, so a credential able to write to
      # production photo storage or the Portainer backups has no place in it. The token
      # used here is refused on every other bucket, verified before it was distributed.
      - name: Publish to dl.breizhzion.com
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          envoyer() {
            aws s3 cp "$1" "s3://breizhzion-releases/noisecrypt/$2"               --endpoint-url "$R2" --content-type "$3"
          }
          for ARCH in amd64 arm64; do
            SRC="artefacts/NoiseCrypt-$V-$ARCH-setup.exe"
            envoyer "$SRC" "NoiseCrypt-Setup-$ARCH.exe"      application/octet-stream
            envoyer "$SRC" "NoiseCrypt-Setup-$ARCH-$V.exe"   application/octet-stream
          done
          # Les binaires nus macOS, qui n'ont pas d'installateur : nom fixe seul, personne
          # n'epinglant leur empreinte.
          for CIBLE in darwin-amd64 darwin-arm64; do
            envoyer "artefacts/noisecrypt-$V-$CIBLE" "noisecrypt-$CIBLE" application/octet-stream
          done
          # Lire-modifier-ecrire du manifeste, protege par le `concurrency` du workflow.
          aws s3 cp "s3://breizhzion-releases/noisecrypt/latest.json" _ancien.json             --endpoint-url "$R2" 2>/dev/null || echo '{}' > _ancien.json

      - name: Build latest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: python
        run: |
          import json, os
          base = "https://dl.breizhzion.com/noisecrypt"
          v = os.environ["VERSION"]
          try:
              with open("_ancien.json") as f:
                  existant = json.load(f)
          except Exception:
              existant = {}
          f = existant.get("files", {})
          for arch in ("amd64", "arm64"):
              f[f"windows_{arch}"] = {
                  "url": f"{base}/NoiseCrypt-Setup-{arch}.exe",
                  "versioned_url": f"{base}/NoiseCrypt-Setup-{arch}-{v}.exe",
                  "version": v,
              }
          for cible in ("darwin-amd64", "darwin-arm64"):
              f[cible.replace("darwin", "macos")] = {
                  "url": f"{base}/noisecrypt-{cible}", "version": v,
              }
          # Linux : le depot apt fait autorite, donc le manifeste renvoie vers lui plutot
          # que vers une copie R2 qui serait une seconde source de verite.
          f["linux_apt"] = {"url": "https://apt.breizhzion.com", "version": v}
          data = {"version": v, "tag": f"v{v}", "files": f}
          with open("latest.json", "w") as out:
              json.dump(data, out, indent=2)
          print(json.dumps(data, indent=2))

      - name: Push latest.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          aws s3 cp latest.json "s3://breizhzion-releases/noisecrypt/latest.json"             --endpoint-url "$R2" --content-type application/json
