name: Publish to the APT repository

# A SEPARATE workflow from the build, but triggered after it.
#
# The separation is deliberate: its own file, its own permissions, and above all a dedicated
# SSH key that has nothing to do with the build's other secrets. What changed on 2026-09-07 is
# the trigger.
#
# ⚠️ It was "manual only", for a real security reason (the only workflow touching a production
# machine from a public repository), and the consequence was that **the apt repository drifted
# in silence**: on the sibling projects a package stayed at 0.1.0 while its releases went to
# 1.0.1 then 1.0.2. Same pattern as winget: the single manual step in an otherwise automated
# chain is the one that never happens. And the manual trigger protected against little, since
# pushing a tag and dispatching a workflow need the same write permission, so it prevented
# accidental runs and not malicious ones. The real protection is elsewhere, in the restricted
# key below.
#
# The SSH key (`AXOLOTL_APT_KEY`) is **dedicated and restricted server-side**: a forced command
# in `authorized_keys` limits it to publishing a package named `noisecrypt`, with no shell and
# no file reads. That is what makes a key pointing at a production machine acceptable in a
# public repository. **Never replace it with a general-access key.**
#
# ⚠️ `workflow_run` trap: it only fires if this file is on the default branch, and its context
# is that branch rather than the tag. The version is therefore read from the event's
# `head_branch`, not from `github.ref`.

on:
  # Chained after the build that produces the .deb packages.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # Kept so a specific version can be replayed by hand.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.4.0). A GitHub Release must already exist for it.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apt:
    name: Publish the .deb packages on apt.breizhzion.com
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A failed build must publish nothing, and a branch build has no release to attach to.
    # Both conditions are needed: `conclusion` alone would let a branch push through,
    # `head_branch` alone would let a failure through.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))

    steps:
      - name: Resolve the version
        id: v
        env:
          INPUT: ${{ inputs.version }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT:-}" ]; then V="$INPUT"; else V="${BRANCH#v}"; fi
          if [ -z "$V" ]; then echo "::error::could not determine the version"; exit 1; fi
          echo "Version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Refuses rather than half-running. Without this the job reaches `ssh` with an empty
      # key and fails there, which reads as a broken key rather than as "never set up".
      - name: Preflight
        env:
          KEY: ${{ secrets.AXOLOTL_APT_KEY }}
          HOST: ${{ secrets.AXOLOTL_HOST }}
          USER_NAME: ${{ secrets.AXOLOTL_USER }}
        run: |
          manquants=""
          for n in KEY HOST USER_NAME; do
            v="${!n:-}"
            # A hyphen, not just emptiness: `gh secret set NAME --body -` stores the literal
            # string "-" instead of reading stdin, which is not empty and satisfies every
            # naive check.
            if [ -z "$v" ] || [ "$v" = "-" ]; then manquants="$manquants $n"; fi
          done
          if [ -n "$manquants" ]; then
            echo "::error title=Not configured::APT publishing is prepared but not set up. Missing or placeholder:$manquants. The key must be a dedicated one, restricted server-side by a forced command limited to the noisecrypt package."
            exit 1
          fi
          echo "Configuration present."

      - name: Fetch the .deb packages from the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "v$VERSION" --repo "${{ github.repository }}" \
            --pattern '*.deb' --dir .
          ls -la *.deb

      # One connection per package, with no scp and no remote command: the key is bound to
      # a forced command that reads the package on standard input. Both architectures are
      # sent, because a repository that offers only amd64 silently leaves ARM64 machines
      # unable to install.
      - name: Publish through the restricted key
        env:
          SSH_KEY: ${{ secrets.AXOLOTL_APT_KEY }}
          HOST: ${{ secrets.AXOLOTL_HOST }}
          USER_NAME: ${{ secrets.AXOLOTL_USER }}
        run: |
          set -euo pipefail
          echo "$SSH_KEY" > /tmp/apt_key
          chmod 600 /tmp/apt_key
          for DEB in *.deb; do
            echo "Publishing $DEB"
            ssh -i /tmp/apt_key \
              -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes \
              "$USER_NAME@$HOST" < "$DEB"
          done
          rm -f /tmp/apt_key
          echo "Published on https://apt.breizhzion.com (apt install noisecrypt)"
