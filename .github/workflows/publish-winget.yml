name: Publish to winget

# Called by the `winget` job of release.yml on every pushed version tag, and runnable by
# hand (with `dry_run` to generate the manifest without opening a pull request). Same
# wiring as BeamMeUp.
#
# Automatic since 2026-10-24, the day Breizhzion.NoiseCrypt was merged into
# microsoft/winget-pkgs (PR #431231). Before that it was manual and disabled, because a
# first submission cannot be made by `update`. So a tag now opens a pull request on a
# third-party repository reviewed by moderators, which is why the privacy policy check
# below runs first and blocks the publication when the page may have become wrong.
#
# Still no chained opt-in variable. The mechanism used previously elsewhere in this
# ecosystem (a repository variable set to true, consumed, then reset to false at the end of
# the job) rested on a token that answered 401 without failing the step, so the variable
# stayed stuck at true and everything published automatically.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        type: string
      dry_run:
        description: 'Dry run: generate the manifest, open NO pull request'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.3.0). A GitHub Release must already exist for it.'
        required: true
        type: string
      dry_run:
        description: 'Dry run: generate the manifest, open NO pull request'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  winget:
    name: Update the Breizhzion.NoiseCrypt manifest
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      # First, and blocking: the manifest points at web/privacy.html as its PrivacyUrl, and
      # a winget moderator asked for that page precisely because it must say what the
      # program writes. A version whose code no longer matches it is not published until
      # the page has been reread. Same guard as BeamMeUp, which learnt it the hard way.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Privacy policy matches the code
        shell: pwsh
        run: python scripts/verifier-ecritures-disque.py

      # This job can only ever *update* a package that already exists upstream, and the
      # first submission has to be made by hand. Until that has been merged there is
      # nothing to update, and `wingetcreate update` fails with a message about the package
      # not being found that reads like a typo in the identifier rather than like a missing
      # prerequisite. So the prerequisite is checked, and named.
      #
      # Kept after the package was merged: it costs one request, and a package removed
      # upstream would otherwise fail later on a message that does not name the cause.
      - name: Preflight
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          # A hyphen, not just emptiness. `gh secret set NAME --body -` stores the literal
          # string "-" instead of reading stdin, which is not empty and satisfies every
          # naive check: that is how a release was once attempted with hyphens for
          # credentials.
          if ([string]::IsNullOrWhiteSpace($env:WINGET_PAT) -or $env:WINGET_PAT -eq "-") {
            Write-Host "::error title=Not configured::WINGET_PAT is missing or is a placeholder."
            exit 1
          }

          $path = "manifests/b/Breizhzion/NoiseCrypt"
          $url  = "https://api.github.com/repos/microsoft/winget-pkgs/contents/$path"
          try {
            Invoke-RestMethod -Uri $url -Headers @{
              Authorization = "Bearer $env:WINGET_PAT"
              Accept        = "application/vnd.github+json"
              "User-Agent"  = "noisecrypt-ci"
            } | Out-Null
          } catch {
            Write-Host "::error title=Package not published yet::Breizhzion.NoiseCrypt does not exist in microsoft/winget-pkgs, so there is nothing for 'wingetcreate update' to update. Submit it once by hand with 'wingetcreate new' and wait for that pull request to be merged, then re-run this."
            exit 1
          }
          Write-Host "Breizhzion.NoiseCrypt is present upstream. Proceeding."

      - name: Find the installers in the release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $tag = "v$($env:VERSION)"
          $assets = gh release view $tag --repo ${{ github.repository }} --json assets -q '.assets[].name'

          # One installer per architecture, and both are required: a manifest that lists
          # only x64 silently leaves ARM64 machines on emulation, or on nothing at all.
          $x64 = $assets | Where-Object { $_ -like '*-amd64-setup.exe' } | Select-Object -First 1
          $arm = $assets | Where-Object { $_ -like '*-arm64-setup.exe' } | Select-Object -First 1
          if (-not $x64) { throw "No amd64 installer in release $tag" }
          if (-not $arm) { throw "No arm64 installer in release $tag" }

          Write-Host "Tag $tag`n  x64:   $x64`n  arm64: $arm"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "x64=$x64" >> $env:GITHUB_OUTPUT
          "arm=$arm" >> $env:GITHUB_OUTPUT

      # This repository being public, a GitHub Release asset is already a stable, publicly
      # reachable URL that is never overwritten, which is exactly what winget requires, and
      # it is the URL of the manifest the moderator accepted. No intermediate bucket or CDN.
      - name: wingetcreate update
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
          VERSION: ${{ inputs.version }}
          BASE: https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: pwsh
        run: |
          # The personal fork falls behind microsoft/winget-pkgs, which is a very
          # high-traffic repository, and wingetcreate then fails with "the forked
          # repository could not be synced". Resynchronised first.
          #
          # BLOCKING since 2026-09-18, and that is the whole point of the change. As a
          # mere warning, the step carried on into a `wingetcreate update` that was
          # already doomed, and failed a minute later with a message that does not name
          # the cause, sending you to look at the package or the token instead. A failure
          # here has a single likely cause, the fork has diverged from upstream, and it is
          # repaired by hand. Retrying is pointless.
          try {
            $sync = Invoke-RestMethod -Method Post `
              -Uri "https://api.github.com/repos/painteau/winget-pkgs/merge-upstream" `
              -Headers @{ Authorization = "Bearer $env:WINGET_PAT"; Accept = "application/vnd.github+json" } `
              -Body (@{ branch = "master" } | ConvertTo-Json) `
              -ContentType "application/json"
            Write-Host "winget-pkgs fork synced: $($sync.message)"
          } catch {
            $code = $_.Exception.Response.StatusCode.value__
            Write-Host "::error title=winget-pkgs fork not synced::HTTP $code. The painteau/winget-pkgs fork cannot be fast-forwarded on master, so wingetcreate would work from a stale base. Most likely cause: the fork has diverged from microsoft/winget-pkgs and must be reset by hand, or deleted and re-forked. Detail: $_"
            exit 1
          }

          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile "wingetcreate.exe"

          # The architecture is stated rather than left to be detected. winget's vocabulary
          # is x64/x86/arm64, and these filenames say "amd64", which it has no reason to
          # recognise. Detection failing here does not produce an error, it produces a
          # manifest with the wrong architecture on it.
          $x64 = "$env:BASE/${{ steps.release.outputs.x64 }}|x64"
          $arm = "$env:BASE/${{ steps.release.outputs.arm }}|arm64"

          if ($env:DRY_RUN -eq 'true') {
            $essai = Join-Path $env:RUNNER_TEMP "winget-dry-run"
            .\wingetcreate.exe update Breizhzion.NoiseCrypt `
              --version $env:VERSION `
              --urls "$x64" "$arm" `
              --token $env:WINGET_PAT `
              --out $essai
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::wingetcreate update failed (rc=$LASTEXITCODE)"; exit 1 }
            Get-ChildItem -Path $essai -Recurse -Filter "*.yaml" | ForEach-Object {
              Write-Host "=== $($_.Name) ==="
              Get-Content $_.FullName
            }
            Write-Host "DRY RUN: manifest generated, no pull request opened."
            exit 0
          }

          .\wingetcreate.exe update Breizhzion.NoiseCrypt `
            --version $env:VERSION `
            --urls "$x64" "$arm" `
            --token $env:WINGET_PAT `
            --submit `
            --no-open
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::wingetcreate update failed (rc=$LASTEXITCODE)"; exit 1 }
