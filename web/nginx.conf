server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # Transcrite d'ombra/web, a une difference pres et elle est voulue : pas de
        # 'unsafe-inline' dans style-src. Cette page n'a aucun attribut style, donc
        # l'autoriser serait ouvrir une porte dont personne ne se sert. Verifie plutot que
        # suppose, et un `grep style=` de reglage suffit a le reverifier apres coup.
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://cdn.breizhzion.com; font-src 'self' https://cdn.breizhzion.com; img-src 'self' data:; script-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    }

    location ~* \.(svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
}
